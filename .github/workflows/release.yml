name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Windows app
        working-directory: desktop
        run: |
          npm install
          npm run build
      - name: Zip it
        working-directory: desktop/dist
        run: zip -r ../../UtaViewer-win-x64.zip UtaViewer-win32-x64
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" UtaViewer-win-x64.zip --clobber
          else
            gh release create "${{ github.ref_name }}" UtaViewer-win-x64.zip --title "UtaViewer ${{ github.ref_name }}" --notes "Windows 64-bit build. Unzip and run UtaViewer.exe."
          fi
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtaViewer-win-x64
          path: UtaViewer-win-x64.zip
